name: "GEDIV | Testes isolados do piloto"

on:
  push:
    branches: ["codex/piloto-gediv-20261031"]
    paths:
      - ".github/workflows/testes-piloto.yml"
      - "src/**"
      - "tests/**"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    if: ${{ github.event.repository.private == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: python -m pip install -r requirements.txt
      - name: Executar testes sem dados de produção
        run: python -m unittest discover -s tests -v
